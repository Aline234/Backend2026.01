<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h2>Cadastro de Clientes</h2>

    <form action="http://localhost:8080/dados" method="post" >
        <label for="nome">Nome:</label>
        <input type="text" name="nome" id="nome" placeholder="Digite seu nome" maxlength="80">
        <br><br>
        <label for="idade">Idade:</label>
        <input type="number" name="idade" id="idade" min ="16" max ="99" placeholder="Digite sua Idade">
        <br><br>
        <button type ="submit">Enviar</button>
        

    </form>
</body>
</html>
